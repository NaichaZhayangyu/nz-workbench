<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶茶炸洋芋 · 团队工作台</title>
<meta name="theme-color" content="#7d4aae">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="团队工作台">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="iconflat.png?v=6">
<link rel="icon" type="image/png" href="iconflat.png?v=6">
<style>
  :root{
    --p-purple-50:#f6f2fb;
    --p-purple-100:#efe7f8;
    --p-purple-200:#e3d4f2;
    --p-purple-300:#cdb4e8;
    --p-purple-400:#b08dd9;
    --p-purple-500:#955fc4;
    --p-purple-600:#7d4aae;
    --gold:#c9a24b;
    --gold-light:#e7cf94;
    --gold-deep:#a9862f;
    --ink:#3a2f47;
    --ink-soft:#6b5e7a;
    --line:#e6dcf2;
    --white:#fffdfe;
    --shadow:0 8px 30px rgba(125,74,174,.10);
    --shadow-sm:0 3px 12px rgba(125,74,174,.08);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
    color:var(--ink);
    background:linear-gradient(135deg,#faf6ff 0%,#f3ecfb 45%,#f7f0fc 100%);
    background-attachment:fixed;
    font-size:15px;line-height:1.6;
    overflow:hidden;
  }
  .app{display:flex;height:100vh;width:100%;}
  .sidebar{
    width:230px;flex:0 0 230px;height:100%;
    background:linear-gradient(180deg,#fbf7ff,#f3ebfb);
    border-right:1.5px solid var(--line);
    display:flex;flex-direction:column;padding:22px 14px;
    box-shadow:2px 0 24px rgba(125,74,174,.05);
    z-index:30;
  }
  .brand{text-align:center;padding-bottom:16px;margin-bottom:10px;border-bottom:1px dashed var(--gold-light);}
  .brand .logo{
    font-size:20px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(90deg,var(--p-purple-600),var(--gold-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .brand .sub{font-size:11px;color:var(--gold-deep);letter-spacing:3px;margin-top:4px;font-weight:600;}
  .nav{display:flex;flex-direction:column;gap:6px;margin-top:8px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;
    padding:13px 14px;border-radius:14px;cursor:pointer;
    color:var(--ink-soft);font-weight:600;font-size:14.5px;
    border:1px solid transparent;transition:.22s;position:relative;
  }
  .nav-item .ico{font-size:18px;filter:saturate(1.1);}
  .nav-item:hover{background:var(--p-purple-50);color:var(--p-purple-600);}
  .nav-item.active{
    background:linear-gradient(120deg,#fff,var(--p-purple-100));
    color:var(--p-purple-600);
    border:1px solid var(--gold-light);
    box-shadow:var(--shadow-sm);
  }
  .nav-item.active::before{
    content:"";position:absolute;left:-14px;top:18px;bottom:18px;width:4px;
    border-radius:4px;background:linear-gradient(var(--p-purple-500),var(--gold));
  }
  .sidebar-foot{margin-top:auto;text-align:center;font-size:10.5px;color:var(--ink-soft);opacity:.7;padding-top:14px;border-top:1px dashed var(--line);}
  .lan-btn{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;padding:11px;border-radius:13px;cursor:pointer;font-weight:700;font-size:13.5px;color:#5a4410;background:linear-gradient(120deg,#e7cf94,#c9a24b);box-shadow:0 3px 12px rgba(201,162,75,.25);transition:.18s;}
  .lan-btn:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(201,162,75,.34);}
  /* 手机扫码弹窗 */
  .qr-box{text-align:center;}
  .qr-box .qr-img{width:220px;height:220px;margin:6px auto 12px;border:1px solid var(--line);border-radius:16px;padding:10px;background:#fff;}
  .qr-box .url-line{font-size:13px;color:var(--ink-soft);background:var(--p-purple-50);border-radius:10px;padding:9px 12px;word-break:break-all;margin:8px 0;}
  .qr-box .copy-btn{margin-top:4px;}
  .qr-box .hint{font-size:12px;color:var(--gold-deep);margin-top:10px;line-height:1.7;}
  .main{flex:1;height:100%;overflow-y:auto;padding:30px 34px 60px;position:relative;}
  .page{display:none;animation:fade .35s ease;}
  .page.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

  .page-head{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
  .page-title{font-size:23px;font-weight:800;color:var(--p-purple-600);display:flex;align-items:center;gap:10px;}
  .page-title .tag{font-size:12px;font-weight:600;color:var(--gold-deep);background:linear-gradient(120deg,#fff,var(--p-purple-50));border:1px solid var(--gold-light);padding:3px 11px;border-radius:20px;}
  .page-desc{color:var(--ink-soft);font-size:13px;margin-top:3px;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:20px;}
  .gold-line{height:3px;width:54px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--gold-light));margin-bottom:14px;}
  .btn{
    border:none;cursor:pointer;border-radius:13px;padding:10px 18px;font-weight:700;font-size:14px;
    background:linear-gradient(120deg,var(--p-purple-500),var(--p-purple-600));color:#fff;
    box-shadow:0 4px 14px rgba(125,74,174,.25);transition:.2s;font-family:inherit;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(125,74,174,.32);}
  .btn.gold{background:linear-gradient(120deg,var(--gold-light),var(--gold));color:#5a4410;box-shadow:0 4px 14px rgba(201,162,75,.3);}
  .btn.ghost{background:var(--p-purple-50);color:var(--p-purple-600);box-shadow:none;border:1px solid var(--line);}
  .btn.sm{padding:7px 13px;font-size:12.5px;border-radius:10px;}

  input,textarea,select{
    font-family:inherit;font-size:14px;color:var(--ink);
    border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fffdfe;outline:none;transition:.2s;width:100%;
  }
  input:focus,textarea:focus,select:focus{border-color:var(--p-purple-300);box-shadow:0 0 0 3px var(--p-purple-100);}
  textarea{resize:vertical;min-height:80px;}
  label{font-size:12.5px;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:5px;}

  /* ===== modal ===== */
  .mask{position:fixed;inset:0;background:rgba(58,47,71,.34);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:100;padding:18px;}
  .mask.show{display:flex;animation:fade .25s;}
  .modal{background:var(--white);border-radius:22px;border:1px solid var(--gold-light);box-shadow:var(--shadow);width:100%;max-width:440px;max-height:88vh;overflow-y:auto;padding:24px;animation:pop .3s ease;}
  @keyframes pop{from{transform:scale(.94);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h3{margin:0 0 4px;color:var(--p-purple-600);font-size:18px;display:flex;align-items:center;gap:8px;}
  .modal .mdesc{font-size:12.5px;color:var(--ink-soft);margin-bottom:16px;}
  .modal .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .modal .row .btn{flex:1;}
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:6px;}
  .opt{border:1.5px solid var(--line);border-radius:14px;padding:13px 10px;text-align:center;cursor:pointer;font-weight:700;color:var(--ink-soft);transition:.18s;background:#fffdfe;}
  .opt:hover{border-color:var(--p-purple-300);color:var(--p-purple-600);background:var(--p-purple-50);}
  .opt.sel{border-color:var(--gold);background:linear-gradient(120deg,#fff,var(--p-purple-50));color:var(--p-purple-600);box-shadow:0 3px 12px rgba(201,162,75,.18);}

  /* ===== schedule ===== */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .cal-head .mon{font-size:18px;font-weight:800;color:var(--p-purple-600);}
  .cal-head .navbtns{display:flex;gap:8px;}
  .cal-head .navbtns button{width:38px;height:38px;border-radius:12px;font-size:17px;border:1px solid var(--line);background:#fffdfe;cursor:pointer;color:var(--p-purple-600);}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;}
  .cal-dow{text-align:center;font-size:12px;font-weight:700;color:var(--gold-deep);padding:6px 0;}
  .cal-cell{
    position:relative;aspect-ratio:1/1.25;border-radius:14px;border:1px solid var(--line);
    background:#fffdfe;cursor:pointer;padding:8px 8px 6px;display:flex;flex-direction:column;gap:3px;transition:.16s;overflow:hidden;
  }
  .cal-cell:hover{border-color:var(--p-purple-300);box-shadow:var(--shadow-sm);transform:translateY(-1px);}
  .cal-cell .dnum{font-weight:800;font-size:14px;color:var(--ink);}
  .cal-cell.today .dnum{color:#fff;background:linear-gradient(120deg,var(--p-purple-500),var(--p-purple-600));width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .cal-cell.other{opacity:.4;}
  .cal-cell .mini{font-size:9.5px;line-height:1.25;color:var(--p-purple-600);overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;}
  .cal-cell .mini .chip{display:inline-block;background:var(--p-purple-100);border-radius:6px;padding:1px 5px;margin:1px 2px 0 0;}
  .sched-detail{margin-top:18px;}
  .sched-detail h4{color:var(--p-purple-600);margin:0;font-size:15px;}
  .sched-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;}
  .sched-head h4{flex:1;min-width:0;}
  .slot-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;}
  .slot{border:1px solid var(--line);border-radius:11px;padding:9px 11px;display:flex;justify-content:space-between;align-items:center;background:#fffdfe;cursor:pointer;transition:.16s;}
  .slot:hover{border-color:var(--p-purple-300);background:var(--p-purple-50);}
  .slot .t{font-weight:700;font-size:13px;color:var(--ink);}
  .slot .p{font-size:12px;color:var(--p-purple-600);font-weight:600;}
  .slot.empty .p{color:var(--ink-soft);opacity:.55;}
  .slot.has{background:linear-gradient(120deg,#fff,var(--p-purple-50));border-color:var(--gold-light);}
  .slot .del-shift{margin-left:8px;color:#c98;cursor:pointer;font-weight:700;font-size:14px;flex:0 0 auto;}
  .slot .del-shift:hover{color:#a55;}
  .edit-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .empty-tip{text-align:center;color:var(--ink-soft);opacity:.7;padding:30px 10px;font-size:14px;line-height:1.8;}

  /* ===== 发薪日 ===== */
  .pay-summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px;}
  .pay-card{background:linear-gradient(135deg,#fbf6ff,#f1e7fb);border:1px solid var(--gold-light);border-radius:var(--radius);padding:18px;}
  .pay-card .lab{font-size:12px;color:var(--gold-deep);font-weight:700;letter-spacing:1px;}
  .pay-card .big{font-size:26px;font-weight:900;color:var(--p-purple-600);margin:6px 0 2px;}
  .pay-card .sub{font-size:12px;color:var(--ink-soft);}
  .pay-card.next{background:linear-gradient(135deg,#fff8ec,#f6eccf);border-color:var(--gold);}
  .pay-card.next .big{background:linear-gradient(90deg,var(--gold-deep),var(--p-purple-600));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .pay-table{width:100%;border-collapse:collapse;margin-top:6px;}
  .pay-table th{font-size:12px;color:var(--gold-deep);text-align:left;padding:8px 10px;border-bottom:2px solid var(--gold-light);}
  .pay-table td{font-size:13.5px;padding:11px 10px;border-bottom:1px dashed var(--line);}
  .pay-table tr:hover td{background:var(--p-purple-50);}
  .pay-date{font-weight:800;color:var(--p-purple-600);}
  .pay-scope{color:var(--ink-soft);font-size:12.5px;}
  .pay-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:20px;background:var(--p-purple-100);color:var(--p-purple-600);}
  .pay-badge.upcoming{background:linear-gradient(120deg,var(--gold-light),var(--gold));color:#5a4410;}
  .pay-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;}
  .pay-toolbar .hint{font-size:12px;color:var(--ink-soft);}
  .pay-status{font-size:12.5px;color:var(--gold-deep);background:var(--p-purple-50);border-radius:10px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pay-status .dot{width:8px;height:8px;border-radius:50%;background:var(--p-purple-400);}
  .pay-status.ok .dot{background:#4caf50;}
  .pay-status.warn .dot{background:#e0a000;}

  /* ===== alarm alert ===== */
  .alarm-alert{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(125,74,174,.92),rgba(169,134,47,.92));backdrop-filter:blur(4px);padding:24px;}
  .alarm-alert.show{display:flex;animation:fade .3s;}
  .alarm-alert .box{background:#fffdfe;border-radius:26px;box-shadow:0 20px 60px rgba(0,0,0,.35);width:100%;max-width:380px;padding:34px 26px;text-align:center;animation:pop .4s ease;}
  .alarm-alert .bell{font-size:54px;animation:bell .9s ease-in-out infinite;}
  @keyframes bell{0%,100%{transform:rotate(0);}20%{transform:rotate(14deg);}40%{transform:rotate(-12deg);}60%{transform:rotate(8deg);}80%{transform:rotate(-4deg);}}
  .alarm-alert .a-title{font-size:22px;font-weight:900;background:linear-gradient(90deg,var(--p-purple-600),var(--gold-deep));-webkit-background-clip:text;background-clip:text;color:transparent;margin:10px 0 6px;}
  .alarm-alert .a-msg{font-size:15px;color:var(--ink);line-height:1.7;font-weight:600;margin-bottom:8px;}
  .alarm-alert .a-sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:20px;}
  .alarm-alert .a-close{width:100%;font-size:16px;padding:14px;border-radius:16px;}
  .alarm-alert .a-snooze{margin-top:10px;width:100%;font-size:13px;padding:11px;border-radius:14px;background:var(--p-purple-50);color:var(--p-purple-600);border:1px solid var(--line);cursor:pointer;font-weight:700;}

  .alarm-dot{position:fixed;top:14px;right:18px;z-index:120;background:linear-gradient(120deg,var(--p-purple-500),var(--gold));color:#fff;border-radius:14px;padding:9px 15px;font-size:13px;font-weight:700;box-shadow:var(--shadow);display:none;cursor:pointer;max-width:320px;}

  /* toast */
  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:linear-gradient(120deg,var(--p-purple-600),var(--gold-deep));color:#fff;padding:12px 22px;border-radius:30px;font-weight:700;font-size:14px;box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:200;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .menu-toggle{display:none;position:fixed;top:14px;left:14px;z-index:40;width:42px;height:42px;border-radius:12px;background:linear-gradient(120deg,var(--p-purple-500),var(--gold));color:#fff;border:none;font-size:20px;cursor:pointer;box-shadow:var(--shadow);align-items:center;justify-content:center;}
  .scrim{display:none;position:fixed;inset:0;background:rgba(58,47,71,.3);z-index:25;}
  .scrim.show{display:block;}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:var(--p-purple-200);border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--p-purple-300);}
  .hide{display:none !important;}

  /* responsive */
  @media(max-width:860px){
    .sidebar{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:.3s;width:200px;flex-basis:200px;}
    .sidebar.open{transform:none;}
    .main{padding:18px 16px 70px;}
    .menu-toggle{display:flex !important;}
    .pay-summary{grid-template-columns:1fr;}
    .page-title{font-size:19px;}
  }
</style>
</head>
<body>
<button class="menu-toggle" id="menuToggle" title="菜单">☰</button>
<div class="scrim" id="scrim"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">奶茶炸洋芋</div>
      <div class="sub">团 队 工 作 台</div>
    </div>
    <nav class="nav" id="nav">
      <div class="nav-item active" data-page="schedule"><span class="ico" data-ico="schedule"></span><span>班表</span></div>
      <div class="nav-item" data-page="payday"><span class="ico" data-ico="payday"></span><span>发薪日</span></div>
    </nav>
    <div class="sidebar-foot">团队共享 · 招财喜乐<br>数据仅存于本机</div>
    <div class="lan-btn" id="lanBtn">📱 手机扫码打开</div>
  </aside>

  <main class="main" id="main">
    <!-- ===== 1. 班表 ===== -->
    <section class="page active" id="schedule">
      <div class="page-head">
        <div>
          <div class="page-title"><span class="ico" data-ico="schedule"></span>班表 <span class="tag">在线客服排班</span></div>
          <div class="page-desc">点日期+时段 → 选项目组 → 一键记录，上班前 15 分钟强提醒</div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn ghost sm" id="exportSched">导出本月</button>
          <button class="btn ghost sm" id="testAlarmBtn">试一下闹钟</button>
        </div>
      </div>
      <div class="card">
        <div class="cal-head">
          <div class="mon" id="calMon">—</div>
          <div class="navbtns">
            <button id="prevM">‹</button>
            <button id="todayM">今</button>
            <button id="nextM">›</button>
          </div>
        </div>
        <div class="cal-grid" id="calGrid"></div>
      </div>
      <div class="card sched-detail">
        <div class="sched-head">
          <h4 id="selDateTitle">— 排班详情</h4>
          <button class="btn gold sm" id="selEditBtn">＋ 排班</button>
        </div>
        <div class="slot-list" id="slotList"></div>
      </div>
    </section>

    <!-- ===== 2. 发薪日 ===== -->
    <section class="page" id="payday">
      <div class="page-head">
        <div>
          <div class="page-title"><span class="ico" data-ico="payday"></span>发薪日 <span class="tag">智能工作日计算</span></div>
          <div class="page-desc">按国家法定节假日 + 调休补班，自动算出每月两次发薪日</div>
        </div>
      </div>
      <div class="card">
        <div class="pay-status" id="payStatus"><span class="dot"></span><span id="payStatusText">加载中…</span></div>
        <div class="pay-summary">
          <div class="pay-card next">
            <div class="lab">下一次发薪</div>
            <div class="big" id="nextPayDate">—</div>
            <div class="sub" id="nextPayScope">—</div>
          </div>
          <div class="pay-card">
            <div class="lab">再过多久</div>
            <div class="big" id="nextPayIn">—</div>
            <div class="sub" id="nextPayWeekday">—</div>
          </div>
        </div>
        <div class="pay-toolbar">
          <select id="payYearSel" style="width:auto;min-width:110px;"></select>
          <button class="btn ghost sm" id="refreshHoliday">↻ 刷新节假日</button>
          <span class="hint">规则：本月第10个工作日发上月15日~月底；本月16日起第10个工作日发本月1~15日</span>
        </div>
        <table class="pay-table">
          <thead><tr><th>发薪日</th><th>星期</th><th>发放薪资区间</th><th>状态</th></tr></thead>
          <tbody id="payBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div class="alarm-dot" id="alarmDot"></div>
<div class="alarm-alert" id="alarmAlert">
  <div class="box">
    <div class="bell">⏰</div>
    <div class="a-title">上班提醒</div>
    <div class="a-msg" id="alarmMsg"></div>
    <div class="a-sub">距离上班还有 15 分钟，该准备了～</div>
    <button class="btn a-close" id="alarmClose">我知道了</button>
    <button class="a-snooze" id="alarmSnooze">5 分钟后再提醒</button>
  </div>
</div>
<div class="toast" id="toast"></div>
